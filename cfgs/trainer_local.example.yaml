# Template for a machine-local trainer config. Copy to cfgs/trainer_local.yaml
# (gitignored) and replace CHECKPOINT_DIR_PATH with a path on fast local disk —
# not a cloud-synced folder, which corrupts checkpoint writes.
accelerator: gpu
strategy: auto
devices: 1
num_nodes: 1
precision: 32-true
logger:
  class_path: pytorch_lightning.loggers.wandb.WandbLogger
  init_args:
    project: wildfire-spread-bench
    log_model: true
callbacks:
  - class_path: pytorch_lightning.callbacks.model_checkpoint.ModelCheckpoint
    init_args:
      dirpath: CHECKPOINT_DIR_PATH
      filename: "{epoch}-{val_loss:.4f}"
      monitor: val_loss
      mode: min
      save_top_k: 1
      save_last: true
  - class_path: evaluation.unified_eval_callback.UnifiedEvalCallback
    init_args:
      eval_every_n_epochs: 10
      max_batches: null
fast_dev_run: false
max_epochs: 100
min_epochs: -1
max_steps: -1
min_steps: -1
max_time: null
limit_train_batches: null
limit_val_batches: null
limit_test_batches: null
limit_predict_batches: null
overfit_batches: 0.0
val_check_interval: null
check_val_every_n_epoch: 1
num_sanity_val_steps: null
log_every_n_steps: null
enable_checkpointing: null
enable_progress_bar: true
enable_model_summary: null
accumulate_grad_batches: 1
gradient_clip_val: null
gradient_clip_algorithm: null
deterministic: warn
benchmark: false
inference_mode: true
use_distributed_sampler: true
profiler: null
detect_anomaly: false
barebones: false
plugins: null
sync_batchnorm: false
reload_dataloaders_every_n_epochs: 0
default_root_dir: ./lightning_logs
