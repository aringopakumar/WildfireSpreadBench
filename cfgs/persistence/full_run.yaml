# pytorch_lightning==2.0.1
# Persistence baseline: predicts tomorrow's fire mask as today's active-fire
# detections. It has no trainable parameters, so training is skipped and only
# the test metrics are computed.
seed_everything: 0
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.0

model:
  class_path: PersistenceModel
  init_args:
    n_channels: 40
    flatten_temporal_dimension: false
    pos_class_weight: 236 # (relative frequency in augmented 2018 and 2020 fires)^-1
    loss_function: "BCE"
    use_all_detections: true

do_train: false
do_test: true
do_predict: false
